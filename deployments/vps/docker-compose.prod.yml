services:
  caddy:
    image: caddy:2-alpine
    container_name: waymesh-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      waymesh-node:
        condition: service_started

  waymesh-node:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.node
    container_name: waymesh-node
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-waymesh}:${POSTGRES_PASSWORD:-waymesh_secret}@postgis:5432/${POSTGRES_DB:-waymesh}
      - RUST_LOG=waymesh_server=info,tower_http=info
    depends_on:
      postgis:
        condition: service_healthy

  postgis:
    image: postgis/postgis:16-3.4
    container_name: waymesh-postgis
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-waymesh}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-waymesh_secret}
      - POSTGRES_DB=${POSTGRES_DB:-waymesh}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ../docker/postgis-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waymesh} -d ${POSTGRES_DB:-waymesh}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
  caddy_data:
  caddy_config:
