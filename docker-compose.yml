services:
  waymesh-node:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.node
    container_name: waymesh-node
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://waymesh:waymesh_secret@postgis:5432/waymesh
      - RUST_LOG=waymesh_server=info,tower_http=info
    depends_on:
      postgis:
        condition: service_healthy

  postgis:
    image: postgis/postgis:16-3.4
    container_name: waymesh-postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=waymesh
      - POSTGRES_PASSWORD=waymesh_secret
      - POSTGRES_DB=waymesh
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./deployments/docker/postgis-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waymesh -d waymesh"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
